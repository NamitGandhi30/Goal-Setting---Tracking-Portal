services:
  - type: web
    name: goal-tracking-api
    env: docker
    rootDir: backend
    dockerfilePath: Dockerfile
    plan: starter
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: DEBUG
        value: "false"
      - key: AUTO_SEED
        value: "false"
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: CORS_ORIGINS
        value: '["https://your-vercel-domain"]'
      - key: APP_FRONTEND_URL
        value: "https://your-vercel-domain"
